name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # macos-15, deliberately, and not a newer image. The generators' output bytes depend on the
    # json gem's pretty_generate, which renders an empty array as "[\n\n]" on the Ruby 2.6.10
    # this repo is written against and as "[]" on anything newer — so a newer image fails
    # "Verify deterministic generated data" on every pack's sizeBytes and sha256 without a
    # single line of source having changed. The Xcode on this image is chosen below instead.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate source, data, and rights
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff --check HEAD^
          fi
          # Every suite, by glob. The list this replaces named 7 of the 16 Ruby suites and 3 of
          # the 5 shell suites, and what it left out included the one pinning the Apple Maps
          # handoff and all five Baidu suites — so a change could break them and still merge.
          for validator in Scripts/validate_*.rb; do ruby "$validator"; done
          ruby Scripts/validate_data_rights.rb --history
          ruby Scripts/import_osm_metro_geometry.rb --self-test
          for suite in Scripts/test_*.rb; do ruby "$suite"; done
          bash Scripts/check_no_legacy_map_provider.sh

      - name: Verify deterministic generated data
        run: |
          ruby Scripts/generate_city_pack_manifest.rb
          ruby Scripts/generate_city_pack_manifest.rb
          ruby Scripts/generate_official_transit_resources.rb
          ruby Scripts/generate_official_transit_resources.rb
          ruby Scripts/generate_universal_city_data.rb
          ruby Scripts/generate_universal_city_data.rb
          ruby Scripts/generate_station_info_api.rb
          ruby Scripts/generate_station_info_api.rb
          git diff --exit-code -- DataPacks/manifest.json DataPacks/rights_inventory.json DataPacks/sources/8100/metadata.json DataPacks/official_transit_resources.json DataPacks/universal Just-Go/Resources/BundledCityPacks StationInfoAPI/directory/directory.json Just-Go/Resources/StationInfo

      # `.glassEffect` in Core/DesignSystem.swift needs the iOS 26 SDK. This image defaults to
      # Xcode 16.4 / iOS 18.5, where the symbol does not exist, and the failure arrives as a
      # "has no member 'glassEffect'" compile error three hundred lines into a build log with
      # nothing in it pointing at an SDK. Pick the newest Xcode that can compile this app, and
      # say so in one line when the image no longer carries one.
      - name: Select an Xcode that has the iOS SDK this app compiles against
        run: |
          selected=""
          for app in $(ls -d /Applications/Xcode*.app | sort -Vr); do
            version="$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')"
            case "${version%%.*}" in ''|*[!0-9]*) continue ;; esac
            if [ "${version%%.*}" -ge 26 ]; then selected="$app"; break; fi
          done
          if [ -z "$selected" ]; then
            echo "::error::No Xcode 26 or newer on this runner. Just-Go cannot compile without the iOS 26 SDK."
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version
          echo "iOS Simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"

      # After the Xcode selection above, not before: these compile app sources with `swiftc` at
      # -swift-version 6, and the runner's default Xcode is older than this app can be built with.
      - name: Run Swift suites
        run: |
          for suite in Scripts/test_*.sh; do bash "$suite"; done

      - name: Build for iOS Simulator
        run: |
          xcodebuild clean build \
            -project Just-Go.xcodeproj \
            -scheme Just-Go \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build Release policy configuration
        run: |
          xcodebuild build \
            -project Just-Go.xcodeproj \
            -scheme Just-Go \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES
