name: Sync city packs to Gitee

on:
  push:
    paths:
      - "DataPacks/**"
      - "Scripts/import_beijing_enrichment.rb"
      - "Scripts/generate_city_pack_manifest.rb"
      - "Scripts/validate_city_packs.rb"
      - ".github/workflows/sync-city-packs-to-gitee.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITEE_BRANCH: ${{ vars.GITEE_BRANCH || secrets.GITEE_BRANCH || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate city packs
        run: ruby Scripts/validate_city_packs.rb

      - name: Prepare clean deploy tree
        run: |
          set -euo pipefail
          deploy_dir="${RUNNER_TEMP}/city-pack-deploy"
          rm -rf "${deploy_dir}"
          mkdir -p "${deploy_dir}"
          cp -R DataPacks/. "${deploy_dir}/"
          find "${deploy_dir}" -name ".DS_Store" -delete

      - name: Push DataPacks to Gitee
        env:
          GITEE_REPO: ${{ vars.GITEE_REPO || secrets.GITEE_REPO || 'https://gitee.com/E-Rail/just-go.git' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_REPO}" ] || [ -z "${GITEE_TOKEN}" ]; then
            echo "GITEE_REPO and GITEE_TOKEN secrets are required." >&2
            exit 1
          fi

          remote="${GITEE_REPO}"
          case "${remote}" in
            http://*|https://*) ;;
            *) remote="https://gitee.com/${remote}.git" ;;
          esac

          case "${remote}" in
            https://oauth2:*@*) auth_remote="${remote}" ;;
            https://*) auth_remote="${remote/https:\/\//https:\/\/oauth2:${GITEE_TOKEN}@}" ;;
            *) echo "GITEE_REPO must be an HTTPS Gitee URL or owner/repo." >&2; exit 1 ;;
          esac
          auth_remote="${auth_remote//\$\{GITEE_TOKEN\}/${GITEE_TOKEN}}"

          cd "${RUNNER_TEMP}/city-pack-deploy"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${GITEE_BRANCH}"
          git add .
          git commit -m "Sync JustGo city packs"
          git remote add gitee "${auth_remote}"

          if git ls-remote --exit-code --heads gitee "${GITEE_BRANCH}" >/dev/null 2>&1; then
            git fetch --depth=1 gitee "${GITEE_BRANCH}"
            git push --force-with-lease gitee "HEAD:${GITEE_BRANCH}"
          else
            git push gitee "HEAD:${GITEE_BRANCH}"
          fi
